<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>Welcome to socket.io</h1>

  
  <script src="http://localhost:3000/socket.io/socket.io.js"></script>

  
  <script>
    const socket = io('http://localhost:3000', {
      transports: ['websocket']
    });

    socket.emit('msg', 'Hello from client Side');

    socket.emit('active', 'Active Users:');

    socket.on('chat', (cb) => {
      console.log(cb);
    });

    socket.on("join", (cb) => {
        console.log(cb);
    });

    socket.on('announce', (cb) => {
      console.log(cb);
    });


  </script>
</body>
</html>
